<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Townships Edit</title>
<div th:replace="~{fragments/link :: links}"></div>
</head>
<body>

	<!-- Top Navbar Header -->
	<div th:replace="~{header/topheader :: header}"></div>

	<div class="wrapper">

		<!-- Sidebar Navigation -->
		<div th:replace="~{header/sidebar :: sidebar}"></div>

		<!-- Main Content Section -->
		<main class="main-content">

			<!-- Dashboard Subheader -->
			<div
				class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between mb-4">
				<div class="d-flex align-items-center mb-2 mb-sm-0">
					<div
						class="bg-danger text-white rounded-circle p-2 me-3 d-flex align-items-center justify-content-center"
						style="width: 42px; height: 42px;">
						<i class="fa-solid fa-gauge-high fs-5"></i>
					</div>
					<div>
						<h2 class="h5 fw-bold text-slate-800 mb-0">Dashboard</h2>
						<span class="text-muted" style="font-size: 0.8rem;">Welcome
							back, Admin! Here's an overview of your system.</span>
					</div>
				</div>
				<div class="text-muted text-sm-end" style="font-size: 0.8rem;">
					<i class="fa-regular fa-calendar me-1"></i> <span id="liveDate">Tuesday,
						7 October 2025</span> <span class="mx-1">|</span> <i
						class="fa-regular fa-clock me-1"></i> <span id="liveTime">10:24
						AM</span>
				</div>
			</div>

			<!-- Stat Cards Row (4 Cards) -->
			<div class="row g-3 mb-4">
				<div class="col-lg-2 col-md-2 col-sm-12"></div>
				<div class="col-lg-8 col-md-8 col-sm-12">
					<!-- township form start -->
					<div class="card shadow-sm border-0 mt-4">
						<div class="card-header bg-white py-3">
							<h5 class="mb-0 text-secondary fw-bold">
								<i class="fa-solid fa-pen-to-square me-2 text-primary"></i>Edit
								Township
							</h5>
						</div>
						<div class="card-body">
							<!-- Spring Boot / Thymeleaf Edit Form -->
							<form th:action="@{/township/update/{id}(id=${township.id})}" th:object="${township}"
								method="post">

								<!-- ID ကို Hidden ဖြင့် ထည့်သွင်းရန် -->
								<input type="hidden" th:field="*{id}" />

								<div class="mb-3">
									<label for="townshipName" class="form-label fw-semibold">Township
										Name</label> <input type="text" class="form-control" id="townshipName"
										th:field="*{name}" placeholder="Enter township name" required>
								</div>

								<!-- Buttons Section -->
								<div class="d-flex justify-content-end gap-2">
									<a th:href="@{/township/list}"
										class="btn btn-light text-secondary border"> <i
										class="fa-solid fa-arrow-left me-1"></i> Cancel
									</a>
									<button type="submit" class="btn btn-primary">
										<i class="fa-solid fa-save me-1"></i> Update Changes
									</button>
								</div>
							</form>
						</div>
					</div>
					<!-- township form end -->
				</div>
				<div class="col-lg-2 col-md-2 col-sm-12"></div>

			</div>

		</main>
	</div>

	<!-- MODALS SECTION -->

	<!-- 1. Add New License Modal -->
	<div class="modal fade" id="addLicenseModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title fs-6 fw-bold">
						<i class="fa-solid fa-plus me-2"></i>Add New License
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body p-4">
					<form id="licenseForm"
						onsubmit="handleFormSubmit(event, 'addLicenseModal')">
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Plate Number</label> <input
								type="text" class="form-control" placeholder="e.g. 9A-1234"
								required>
						</div>
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Owner Name</label> <input type="text"
								class="form-control" placeholder="e.g. Mg Mg" required>
						</div>
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Township</label> <select
								class="form-select" required>
								<option value="">Select Township</option>
								<option value="Hlaing">Hlaing</option>
								<option value="Kamayut">Kamayut</option>
								<option value="Sanchaung">Sanchaung</option>
								<option value="Mayangone">Mayangone</option>
								<option value="Thingangyun">Thingangyun</option>
							</select>
						</div>
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Expiry Date</label> <input
								type="date" class="form-control" required>
						</div>
						<div class="d-flex justify-content-end gap-2 mt-4">
							<button type="button" class="btn btn-light btn-sm"
								data-bs-dismiss="modal">Cancel</button>
							<button type="submit" class="btn btn-danger btn-sm px-4">Save
								License</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- 2. Add New Car Modal -->
	<div class="modal fade" id="addCarModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<div class="modal-header bg-primary text-white">
					<h5 class="modal-title fs-6 fw-bold">
						<i class="fa-solid fa-car me-2"></i>Add New Car
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body p-4">
					<form onsubmit="handleFormSubmit(event, 'addCarModal')">
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Car Model / Make</label> <input
								type="text" class="form-control"
								placeholder="e.g. Toyota Crown 2020" required>
						</div>
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Plate Number</label> <input
								type="text" class="form-control" placeholder="e.g. 7B-5678"
								required>
						</div>
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Chassis Number</label> <input
								type="text" class="form-control" placeholder="e.g. CHS-992011"
								required>
						</div>
						<div class="d-flex justify-content-end gap-2 mt-4">
							<button type="button" class="btn btn-light btn-sm"
								data-bs-dismiss="modal">Cancel</button>
							<button type="submit" class="btn btn-primary btn-sm px-4">Register
								Car</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- 3. Add Owner Modal -->
	<div class="modal fade" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<div class="modal-header bg-danger text-white">
					<h5 class="modal-title fs-6 fw-bold">
						<i class="fa-solid fa-user-plus me-2"></i>Add New Owner
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body p-4">
					<form onsubmit="handleFormSubmit(event, 'addOwnerModal')">
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Full Owner Name</label> <input
								type="text" class="form-control" placeholder="e.g. U Aung Kyaw"
								required>
						</div>
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">NRC / ID Number</label> <input
								type="text" class="form-control" placeholder="12/UKTA(N)123456"
								required>
						</div>
						<div class="mb-3">
							<label class="form-label font-semibold text-muted"
								style="font-size: 0.8rem;">Phone Number</label> <input
								type="tel" class="form-control" placeholder="09 123456789"
								required>
						</div>
						<div class="d-flex justify-content-end gap-2 mt-4">
							<button type="button" class="btn btn-light btn-sm"
								data-bs-dismiss="modal">Cancel</button>
							<button type="submit" class="btn btn-danger btn-sm px-4">Save
								Owner</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- 4. View Details Modal -->
	<div class="modal fade" id="viewDetailModal" tabindex="-1"
		aria-hidden="true">
		<div class="modal-dialog modal-dialog-centered">
			<div class="modal-content border-0 shadow">
				<div class="modal-header bg-dark text-white">
					<h5 class="modal-title fs-6 fw-bold">
						<i class="fa-solid fa-circle-info me-2"></i>License Details
					</h5>
					<button type="button" class="btn-close btn-close-white"
						data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body p-4" id="viewModalBody">
					<!-- Populated dynamically by JavaScript -->
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary btn-sm"
						data-bs-dismiss="modal">Close</button>
				</div>
			</div>
		</div>
	</div>




</body>
</html>
