<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car Table</title>
<div th:replace="~{fragments/link :: links}"></div>
</head>
<body>

	<!-- Top Navbar Header -->
	<div th:replace="~{header/topheader :: header}"></div>

	<div class="wrapper">

		<!-- Sidebar Navigation -->
		<div th:replace="~{header/sidebar :: sidebar}"></div>

		<!-- Main Content Section -->
		<main class="main-content">

			<!-- Dashboard Subheader -->
			<div
				class="d-flex flex-column flex-sm-row align-items-sm-center justify-content-between mb-4">
				<div class="d-flex align-items-center mb-2 mb-sm-0">
					<div
						class="bg-danger text-white rounded-circle p-2 me-3 d-flex align-items-center justify-content-center"
						style="width: 42px; height: 42px;">
						<i class="fa-solid fa-gauge-high fs-5"></i>
					</div>
					<div>
						<h2 class="h5 fw-bold text-slate-800 mb-0">Dashboard</h2>
						<span class="text-muted" style="font-size: 0.8rem;">Welcome
							back, Admin! Here's an overview of your system.</span>
					</div>
				</div>
				<div class="text-muted text-sm-end" style="font-size: 0.8rem;">
					<i class="fa-regular fa-calendar me-1"></i> <span id="liveDate">Tuesday,
						7 October 2025</span> <span class="mx-1">|</span> <i
						class="fa-regular fa-clock me-1"></i> <span id="liveTime">10:24
						AM</span>
				</div>
			</div>

			<!-- Stat Cards Row (4 Cards) -->
			<div class="row g-3 mb-4">
				<div class="col-lg-1 col-md-1 col-sm-12"></div>
				<div class="col-lg-10 col-md-10 col-sm-12">
				
				<!-- successfully message -->
				<div th:if="${success}"
				class="alert alert-success alert-dismissible fade show"
				role="alert">
					<i class="fa-solid fa-circle-check me-2"></i>
					<span th:text="${success}"></span>
					
					<button type="button"
					class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>
				
				<!-- Delete Message -->
				<div th:if="${deleteMessage}"
				class="alert alert-success alert-dismissible fade show"
				role="alert">
					<i class="fa-solid fa-circle-check me-2"></i>
					<span th:text="${deleteMessage}"></span>
					
					<button type="button"
					class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
				</div>
				
					<!-- table start -->
					<div class="card shadow-sm border-0 mt-4">
						<div class="card-body">
							<div class="table-responsive">
								<table class="table table-hover align-middle mb-0 text-center">
									<thead class="table-light text-secondary">
										<tr>
											<th scope="col" style="width: 10%;">No.</th>
											<th scope="col" style="width: 15%;">Vehicle Type</th>
											<th scope="col" style="width: 15%;">Car Brand</th>
											<th scope="col" style="width: 10%;">Car Model</th>
											<th scope="col" style="width: 15%;">Car Color</th>
											<th scope="col" style="width: 15%;">Manafacture Year</th>
											<th scope="col" style="width: 20%;" class="text-center">Actions</th>
										</tr>
									</thead>
									<tbody>
										<!-- Thymeleaf ဖြင့် ဒေတာများ ထည့်သွင်းရန် (ဥပမာ) -->
										<tr th:each="car, status : ${cars}">
											<td th:text="${status.count}"></td>
											<td th:text="${car.vehicle}"></td>
											<td th:text="${car.carbrand}"></td>
											<td th:text="${car.carmodel}"></td>
											<td th:text="${car.carcolor}"></td>
											<td th:text="${car.manafactureyear}"></td>
											<td class="text-center d-flex">
											
											<a 
												class="btn btn-sm btn-outline-primary me-1"> <i
													class="fa-solid fa-pen-to-square"></i>
											</a> 
											<!-- delete form start -->
												<form>
													<button class="btn btn-sm btn-outline-danger">
														<i class="fa-solid fa-trash"></i>
													</button>
												</form> <!-- delete form end --></td>
											
										</tr>

										<!-- </tr> -->
									</tbody>
								</table>
							</div>
						</div>
					</div>
					<!-- table end -->
				</div>
				<div class="col-lg-1 col-md-1 col-sm-12"></div>

			</div>

		</main>
	</div>

</body>
</html>
