<header class="top-navbar px-3 px-md-4 flex-wrap flex-md-nowrap d-flex items-center justify-content-between shadow-sm" th:fragment="header">
    <div class="d-flex align-items-center">
        <div class="bg-white rounded-circle p-2 d-flex align-items-center justify-center me-3 shadow-sm" style="width: 40px; height: 40px;">
            <i class="fa-solid fa-car-side text-danger fs-5"></i>
        </div>
        <div>
            <h1 class="h6 mb-0 fw-bold text-white tracking-wide">Car License Registration System</h1>
            <small class="text-white-50" style="font-size: 0.7rem;">Safe Drive • Legal Ride • Better Tomorrow</small>
        </div>
    </div>

    <div class="d-flex align-items-center my-2 my-md-0">
        <!-- Search Bar -->
        <div class="input-group me-3" style="width: 260px;">
            <input type="text" id="globalSearchInput" class="form-control search-input form-control-sm px-3" placeholder="Search license, car, owner..." onkeyup="searchGlobalTable()">
            <button class="btn search-btn btn-sm px-3" type="button"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Notifications -->
        <div class="position-relative me-3 cursor-pointer">
            <i class="fa-regular fa-bell fs-5 text-white"></i>
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-circle bg-danger" style="font-size: 0.6rem; padding: 3px 5px;">
                3
            </span>
        </div>

        <!-- Profile Dropdown -->
        <div class="d-flex align-items-center cursor-pointer border-start border-secondary ps-3">
            <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2 font-semibold" style="width: 36px; height: 36px;">
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="d-none d-sm-block text-start" style="line-height: 1.1;">
                <span class="d-block fw-bold text-white" style="font-size: 0.8rem;">Admin <i class="fa-solid fa-chevron-down ms-1 text-white-50" style="font-size: 0.65rem;"></i></span>
                <small class="text-white-50" style="font-size: 0.68rem;">Administrator</small>
            </div>
        </div>
    </div>
</header>
